# Generated by `tak ci init` (takkel 0.0.0) for GitLab CI. Edit freely.
#
# Builds and tests with takkel, and keeps takkel's store (TAKKEL_HOME: compiled results, toolchains) in this
# CI's cache between runs, so a build after the first starts warm. takkel trims the store after every build
# here (TAKKEL_CACHE_MAX_SIZE, else 2G; 1G on Bitbucket) so the saved cache stays small.
# GitLab keeps separate caches for protected and unprotected branches unless the project turns that off
# (Settings > CI/CD > General pipelines), so an unprotected branch starts from its own cache, not the
# default branch's. That keeps a branch anyone can push to from writing what a protected branch builds from.

takkel:
  image: node:lts
  variables:
    TAKKEL_HOME: $CI_PROJECT_DIR/.cache/takkel
  cache:
    key: takkel-$CI_COMMIT_REF_SLUG
    fallback_keys:
      - takkel-$CI_DEFAULT_BRANCH
    paths:
      - .cache/takkel/
    when: always
  script:
    - "npm ci"
    - "npx takkel build"
    - "npx takkel test"
